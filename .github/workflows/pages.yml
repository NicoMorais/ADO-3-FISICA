name: Publish physics simulator

on:
  push:
    branches: [main]
    paths:
      - "ADO3FISICA/index.html"
      - "ADO3FISICA/ADO3_Nicolas_Vinicius_Bruna.py"
      - "ADO3FISICA/RELATORIO_ADO3.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          cp ADO3FISICA/index.html _site/index.html
          cp ADO3FISICA/ADO3_Nicolas_Vinicius_Bruna.py _site/
          cp ADO3FISICA/RELATORIO_ADO3.pdf _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
